<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>David Pérez Salort — CV</title>
  <meta name="robots" content="noindex">
  <!--
    One-page PDF CV template. Renders in Spanish or English with ?lang=es|en
    and is exported to PDF with a headless browser (see README, "CV PDF" section).
  -->
  <style>
    @font-face { font-family: 'Inter'; src: url('../assets/fonts/inter.woff2') format('woff2-variations'); font-weight: 100 900; }
    @font-face { font-family: 'Space Grotesk'; src: url('../assets/fonts/space-grotesk.woff2') format('woff2-variations'); font-weight: 300 700; }

    :root { --ink: #0f172a; --text: #1f2937; --muted: #5b6474; --line: #dfe3ea; --accent: #0a7d42; }
    @page { size: A4; margin: 14mm 16mm; }
    * { box-sizing: border-box; }
    html { -webkit-print-color-adjust: exact; print-color-adjust: exact; font-variant-ligatures: no-common-ligatures; }
    body { margin: 0; background: #fff; color: var(--text); font: 400 9.4pt/1.45 'Inter', system-ui, sans-serif; }
    h1, h2, h3, p, ul { margin: 0; padding: 0; }
    ul { list-style: none; }
    a { color: inherit; text-decoration: none; }

    .page { width: 178mm; }

    .head { display: flex; justify-content: space-between; align-items: flex-end; gap: 8mm; padding-bottom: 4mm; border-bottom: 1.5px solid var(--ink); }
    .name { font: 700 22pt/1 'Space Grotesk', sans-serif; letter-spacing: -.02em; color: var(--ink); }
    .role { margin-top: 1.8mm; font: 600 11pt/1.2 'Space Grotesk', sans-serif; color: var(--accent); }
    .contact { text-align: right; font-size: 8.8pt; line-height: 1.6; color: var(--muted); }
    .summary { margin-top: 4mm; font-size: 9.6pt; }

    .chips { margin-top: 3.5mm; display: flex; flex-wrap: wrap; gap: 1.6mm; }
    .chips li { padding: .7mm 2.2mm; border: 1px solid #c9d0da; border-radius: 1mm; font-size: 8.6pt; font-weight: 600; color: var(--ink); }

    .sec { margin-top: 6mm; }
    .sec-title {
      margin-bottom: 3mm; padding-bottom: 1.2mm; border-bottom: 1px solid var(--line);
      font: 700 8.6pt/1 'Space Grotesk', sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--accent);
      font-variant-ligatures: none;
    }

    .job { break-inside: avoid; }
    .job + .job { margin-top: 3.8mm; }
    .job-top { display: flex; justify-content: space-between; align-items: baseline; gap: 4mm; }
    .job h3 { font: 600 10.4pt/1.3 'Space Grotesk', sans-serif; color: var(--ink); }
    .job h3 span { font-weight: 500; color: var(--muted); }
    .job-date { flex: none; font-size: 8.8pt; color: var(--muted); font-variant-numeric: tabular-nums; }
    .job ul { margin-top: 1.2mm; display: grid; gap: .5mm; }
    .job li { position: relative; padding-left: 4mm; }
    .job li::before { content: ''; position: absolute; left: .6mm; top: .6em; width: 1.3mm; height: 1.3mm; background: var(--accent); }
    .job-tech { margin-top: 1.1mm; font-size: 8.6pt; color: var(--muted); }
    .job-tech b { font-weight: 600; color: var(--text); }

    .rows p + p { margin-top: 1.3mm; }
    .rows b { font-weight: 600; color: var(--ink); }
  </style>
</head>
<body>
  <main class="page" id="cv"></main>

  <script>
    const KEY_TECH = ['Kotlin', 'Kotlin Multiplatform', 'Jetpack Compose', 'Coroutines', 'Flow', 'Hilt', 'Koin', 'Dagger 2', 'Room', 'Retrofit', 'Ktor', 'Bluetooth', 'MVVM', 'Clean Architecture'];

    const DATA = {
      es: {
        role: 'Senior Android Software Engineer',
        location: 'Galicia, España · Remoto',
        summary: 'Desarrollador Android con más de 10 años de experiencia, los últimos 7 como Senior en automoción y movilidad. Especializado en Kotlin, arquitectura de apps y software para vehículos; actualmente en proyectos de Stellantis.',
        techLabel: 'Tecnologías',
        expT: 'Experiencia',
        jobs: [
          ['Senior Android Engineer', 'Coremain · Stellantis', 'Jun 2024 — Actualidad', [
            'Desarrollo Android nativo para plataformas de vehículo.',
            'Lógica compartida entre plataformas con Kotlin Multiplatform.',
            'Calidad continua: code reviews, TeamCity y SonarQube.'],
            'Kotlin, KMP, Jetpack Compose, Coroutines, Flow, Koin, TeamCity, SonarQube'],
          ['Senior Android Engineer', 'SIVSA · Stellantis', 'Mar 2023 — May 2024', [
            'Conectividad dispositivo-vehículo: implementación de protocolos Bluetooth.',
            'Funcionalidades en Kotlin sobre arquitectura MVVM.'],
            'Kotlin, Bluetooth, MVVM'],
          ['Senior Android Engineer', 'SIVSA · Proyecto OMNI', 'Oct 2019 — Feb 2023', [
            'Refactorización de arquitectura hacia patrones modernos y mantenibles.',
            'Code reviews, buenas prácticas de equipo e integraciones de CI/CD.'],
            'Kotlin, Java, CI/CD'],
          ['Android Developer', 'zinkers.io', 'Mar 2016 — Jun 2019', [
            'Único desarrollador Android: 12 apps de cliente, del diseño a Google Play y su mantenimiento.',
            'Apps: LaLiga Fantasy MARCA, SmartStation (white-label con product flavors), Padeltrack, Bingo Falomir, Styloo, Haulap, IOBI Cloud.'],
            'Kotlin, Java, MVP, MVVM, Dagger 2, Retrofit, RxJava, Room, Firebase, Crashlytics'],
          ['Android Developer (prácticas)', 'Incomar Informática', 'Mar 2015 — May 2015', [
            'App nativa de gestión de gastos con servicios web JSON y back-end en PHP y MySQL.'],
            ''],
        ],
        stackT: 'Stack',
        stack: [
          ['Arquitectura', 'MVVM, MVP, Clean Code'],
          ['Herramientas', 'Gradle, Git, TeamCity, SonarQube, Jira, Firebase, Crashlytics'],
          ['También', 'Java, RxJava, Flutter · IA en el día a día (Claude, GitHub Copilot, Gemini)'],
        ],
        otherT: 'Formación e idiomas',
        other: [
          ['Formación', 'Técnico Superior en Desarrollo de Aplicaciones Multiplataforma (DAM), 2015 · Técnico Superior en Administración de Sistemas en Red (ASIR), 2013'],
          ['Idiomas', 'Español (nativo) · Inglés (profesional básico) · Gallego y catalán'],
        ],
      },
      en: {
        role: 'Senior Android Software Engineer',
        location: 'Galicia, Spain · Remote',
        summary: 'Android developer with 10+ years of experience, the last 7 as a Senior in automotive and mobility. Specialised in Kotlin, app architecture and in-vehicle software; currently working on Stellantis projects.',
        techLabel: 'Tech',
        expT: 'Experience',
        jobs: [
          ['Senior Android Engineer', 'Coremain · Stellantis', 'Jun 2024 — Present', [
            'Native Android development for vehicle platforms.',
            'Shared cross-platform logic with Kotlin Multiplatform.',
            'Continuous quality: code reviews, TeamCity and SonarQube.'],
            'Kotlin, KMP, Jetpack Compose, Coroutines, Flow, Koin, TeamCity, SonarQube'],
          ['Senior Android Engineer', 'SIVSA · Stellantis', 'Mar 2023 — May 2024', [
            'Device-to-vehicle connectivity: implemented Bluetooth protocols.',
            'Kotlin features on an MVVM architecture.'],
            'Kotlin, Bluetooth, MVVM'],
          ['Senior Android Engineer', 'SIVSA · OMNI project', 'Oct 2019 — Feb 2023', [
            'Refactored the architecture towards modern, maintainable patterns.',
            'Code reviews, team best practices and CI/CD integrations.'],
            'Kotlin, Java, CI/CD'],
          ['Android Developer', 'zinkers.io', 'Mar 2016 — Jun 2019', [
            'Sole Android developer: 12 client apps, from design to Google Play release and maintenance.',
            'Apps: LaLiga Fantasy MARCA, SmartStation (white-label with product flavors), Padeltrack, Bingo Falomir, Styloo, Haulap, IOBI Cloud.'],
            'Kotlin, Java, MVP, MVVM, Dagger 2, Retrofit, RxJava, Room, Firebase, Crashlytics'],
          ['Android Developer (internship)', 'Incomar Informática', 'Mar 2015 — May 2015', [
            'Native expense-management app with JSON web services and a PHP and MySQL back end.'],
            ''],
        ],
        stackT: 'Stack',
        stack: [
          ['Architecture', 'MVVM, MVP, Clean Code'],
          ['Tools', 'Gradle, Git, TeamCity, SonarQube, Jira, Firebase, Crashlytics'],
          ['Also', 'Java, RxJava, Flutter · AI in daily work (Claude, GitHub Copilot, Gemini)'],
        ],
        otherT: 'Education & languages',
        other: [
          ['Education', 'Higher Diploma in Cross-Platform Application Development (DAM), 2015 · Higher Diploma in Networked Systems Administration (ASIR), 2013'],
          ['Languages', 'Spanish (native) · English (limited working proficiency) · Galician and Catalan'],
        ],
      },
    };

    const lang = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'es';
    const d = DATA[lang];
    document.documentElement.lang = lang;
    document.title = `David Pérez Salort — CV (${lang.toUpperCase()})`;

    const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
    const rows = (list) => `<div class="rows">${list.map(([k, v]) => `<p><b>${esc(k)}:</b> ${esc(v)}</p>`).join('')}</div>`;

    document.getElementById('cv').innerHTML = `
      <header class="head">
        <div>
          <h1 class="name">David Pérez Salort</h1>
          <p class="role">${esc(d.role)}</p>
        </div>
        <p class="contact">
          ${esc(d.location)}<br>
          <a href="mailto:david.perez.salort@gmail.com">david.perez.salort@gmail.com</a><br>
          <a href="https://www.linkedin.com/in/davidperezsalort/">linkedin.com/in/davidperezsalort</a> · <a href="https://github.com/enylrad">github.com/enylrad</a>
        </p>
      </header>
      <p class="summary">${esc(d.summary)}</p>
      <ul class="chips">${KEY_TECH.map((t) => `<li>${esc(t)}</li>`).join('')}</ul>

      <section class="sec">
        <h2 class="sec-title">${esc(d.expT)}</h2>
        ${d.jobs.map(([role, org, date, bullets, tech]) => `
          <article class="job">
            <div class="job-top"><h3>${esc(role)} <span>· ${esc(org)}</span></h3><span class="job-date">${esc(date)}</span></div>
            <ul>${bullets.map((b) => `<li>${esc(b)}</li>`).join('')}</ul>
            ${tech ? `<p class="job-tech"><b>${esc(d.techLabel)}:</b> ${esc(tech)}</p>` : ''}
          </article>`).join('')}
      </section>

      <section class="sec">
        <h2 class="sec-title">${esc(d.stackT)}</h2>
        ${rows(d.stack)}
      </section>

      <section class="sec">
        <h2 class="sec-title">${esc(d.otherT)}</h2>
        ${rows(d.other)}
      </section>
    `;
  </script>
</body>
</html>
