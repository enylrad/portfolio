    Plantilla del CV en PDF. Se renderiza en español o inglés con ?lang=es|en
    y se exporta a PDF con un navegador sin cabeza (ver README, sección «CV»).
  -->
  <style>
    @font-face { font-family: 'Inter'; src: url('../assets/fonts/inter.woff2') format('woff2-variations'); font-weight: 100 900; }
    @font-face { font-family: 'Space Grotesk'; src: url('../assets/fonts/space-grotesk.woff2') format('woff2-variations'); font-weight: 300 700; }

    :root {
      --ink: #0f172a;
      --text: #1f2937;
      --muted: #5b6474;
      --faint: #8a93a3;
      --line: #e3e7ee;
      --accent: #0a7d42;
      --accent-soft: #e8f6ee;
      --side: #f6f8fa;
    }
    @page { size: A4; margin: 10mm 13mm; }
    * { box-sizing: border-box; }
    html { -webkit-print-color-adjust: exact; print-color-adjust: exact; font-variant-ligatures: no-common-ligatures; }
    body {
      margin: 0; background: #fff; color: var(--text);
      font: 400 8.7pt/1.42 'Inter', system-ui, sans-serif;
    }
    h1, h2, h3, p, ul { margin: 0; padding: 0; }
    ul { list-style: none; }
    a { color: inherit; text-decoration: none; }

    .page { width: 184mm; }

    /* ---------- Cabecera ---------- */
    .head { display: flex; justify-content: space-between; align-items: flex-end; gap: 10mm; padding-bottom: 6mm; border-bottom: 2px solid var(--ink); }
    .name { font: 700 25pt/1 'Space Grotesk', sans-serif; letter-spacing: -.03em; color: var(--ink); }
    .role { margin-top: 2.2mm; font: 600 11pt/1.2 'Space Grotesk', sans-serif; color: var(--accent); letter-spacing: -.01em; }
    .contact { text-align: right; font-size: 8.4pt; line-height: 1.65; color: var(--muted); }
    .contact a { color: var(--text); }
    .contact b { font-weight: 600; color: var(--text); }

    /* ---------- Rejilla principal ---------- */
    .cols { display: grid; grid-template-columns: minmax(0, 1fr) 55mm; gap: 8mm; margin-top: 6mm; }

    .sec + .sec { margin-top: 5mm; }
    .sec-title {
      display: flex; align-items: center; gap: 2.2mm; margin-bottom: 3mm;
      font: 700 8.2pt/1 'Space Grotesk', sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--ink); font-variant-ligatures: none;
    }
    .sec-title::before { content: ''; width: 2.2mm; height: 2.2mm; background: var(--accent); flex: none; }
    .sec-title::after { content: ''; flex: 1; height: 1px; background: var(--line); }

    .summary { font-size: 9pt; line-height: 1.5; color: var(--text); }

    /* Experiencia */
    .job-top, .job-org { break-after: avoid; }
    .job li, .job .tags { break-inside: avoid; }
    .job + .job { margin-top: 3.6mm; }
    .job-top { display: flex; justify-content: space-between; align-items: baseline; gap: 4mm; }
    .job h3 { font: 600 10.2pt/1.25 'Space Grotesk', sans-serif; color: var(--ink); }
    .job-date { flex: none; font-size: 8.2pt; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
    .job-org { margin-top: .6mm; font-size: 8.6pt; font-weight: 600; color: var(--accent); }
    .job-org span { font-weight: 400; color: var(--muted); }
    .job-sum { margin-top: 1.4mm; }
    .job > ul:not(.tags) { margin-top: 1.4mm; display: grid; gap: .7mm; }
    .job > ul:not(.tags) > li { position: relative; padding-left: 3.6mm; }
    .job > ul:not(.tags) > li::before { content: ''; position: absolute; left: .4mm; top: .62em; width: 1.4mm; height: 1.4mm; background: var(--accent); }
    .tags { margin-top: 1.8mm; display: flex; flex-wrap: wrap; gap: 1.2mm; }
    .tags li { padding: .5mm 1.8mm; font-size: 7.4pt; font-weight: 500; color: var(--muted); background: var(--side); border: 1px solid var(--line); border-radius: 1mm; }

    /* Barra lateral */
    .side { background: var(--side); padding: 5mm 4.5mm; border-radius: 1.5mm; align-self: start; }
    .side .sec + .sec { margin-top: 5mm; }
    .side .sec-title { margin-bottom: 2.4mm; }
    .skill-group + .skill-group { margin-top: 2.6mm; }
    .skill-group h3 { font: 600 8.2pt/1.3 'Space Grotesk', sans-serif; color: var(--ink); }
    .skill-group p { margin-top: .6mm; font-size: 8.2pt; line-height: 1.5; color: var(--muted); }
    .item + .item { margin-top: 2.4mm; }
    .item strong { display: block; font: 600 8.4pt/1.35 'Space Grotesk', sans-serif; color: var(--ink); }
    .item span { display: block; font-size: 7.9pt; color: var(--muted); line-height: 1.4; }
    .lang { display: flex; justify-content: space-between; gap: 2mm; font-size: 8.4pt; }
    .lang + .lang { margin-top: 1.2mm; }
    .lang b { font-weight: 600; color: var(--ink); }
    .lang span { color: var(--muted); text-align: right; }
    .lang-more { margin-top: 1.6mm; font-size: 7.9pt; color: var(--faint); }

    /* Proyectos */
    .projects { margin-top: 6mm; }
    .proj-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2.2mm 6mm; }
    .proj { break-inside: avoid; padding-top: 2mm; border-top: 1px solid var(--line); }
    .proj-top { display: flex; justify-content: space-between; align-items: baseline; gap: 3mm; }
    .proj h3 { font: 600 9.4pt/1.25 'Space Grotesk', sans-serif; color: var(--ink); }
    .proj-meta { flex: none; font-size: 7.6pt; color: var(--muted); }
    .proj-meta b { font-weight: 600; color: var(--accent); }
    .proj p { margin-top: .7mm; font-size: 7.8pt; line-height: 1.4; }
    .proj .tags { margin-top: 1.2mm; }
    .proj .tags li { font-size: 7.1pt; padding: .3mm 1.6mm; }

    .foot { margin-top: 6mm; padding-top: 2.5mm; border-top: 1px solid var(--line); font-size: 7.4pt; color: var(--faint); display: flex; justify-content: space-between; }

    @media screen {
      body { background: #e9edf2; }
      .page { margin: 10mm auto; padding: 12mm 13mm; width: 210mm; background: #fff; box-shadow: 0 10px 40px rgba(15, 23, 42, .15); }
    }
  </style>
</head>

        </div>

          ${sec(d.skillsT, d.skills.map(([h, p]) => `<div class="skill-group"><h3>${esc(h)}</h3><p>${esc(p)}</p></div>`).join(''))}
          ${sec(d.langT, d.langs.map(([l, v]) => `<p class="lang"><b>${esc(l)}</b><span>${esc(v)}</span></p>`).join('') + `<p class="lang-more">${esc(d.langMore)}</p>`)}
          ${sec(d.eduT, d.edu.map(([t, s]) => `<div class="item"><strong>${esc(t)}</strong><span>${esc(s)}</span></div>`).join(''))}
          ${sec(d.certT, d.certs.map(([t, s]) => `<div class="item"><strong>${esc(t)}</strong><span>${esc(s)}</span></div>`).join(''))}
        </aside>
      </div>

      ${sec(d.projT, `<div class="proj-grid">${PROJECTS.map(([name, ctx, date, es, en, tg]) => `
        <article class="proj">
          <div class="proj-top"><h3>${esc(name)}</h3><span class="proj-meta"><b>${esc(d.ctx[ctx])}</b> · ${esc(typeof date === 'string' ? date : date[lang])}</span></div>
          <p>${esc(lang === 'en' ? en : es)}</p>
          ${tags(tg)}
        </article>`).join('')}</div>`, 'projects')}

      <footer class="foot"><span>David Pérez Salort · ${esc(d.role)}</span><span>${esc(d.foot)}: ${esc(today)}</span></footer>
    `;
  </script>
</body>
</html>
